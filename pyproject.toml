[project]
name = "doc-system"
version = "0.1.0"
description = "Cortex · 通用项目知识库文档系统：让新 Agent 快速、可靠、可追溯地接手任意代码库"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cortex Contributors" }]
keywords = [
  "agent", "knowledge-base", "codebase", "documentation", "retrieval",
  "vector-search", "llm", "onboarding", "context-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]

# 核心依赖：仅 PyYAML。
# 全链路（ingest → 归因 → 渲染 → 索引 → 检索）零第三方依赖即可跑通，
# embedding 走内置 offline 确定性哈希，不需要联网、不需要任何密钥。
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# ANN（近似最近邻）后端：hnswlib 加速大规模向量检索。
# numpy 是 hnswlib 的传递依赖，显式列出以保证版本可控。
ann = ["hnswlib>=0.8.0", "numpy>=1.23"]

# 开发/测试依赖：pytest 是测试套件的唯一必需项。
# CI（.github/workflows/ci.yml）与本地开发共用此 extra，避免「CI 装了什么」
# 与「项目声明了什么」两处漂移 —— pytest 未声明曾导致 CI 全矩阵
# 因 "No module named pytest" 直接失败。
dev = ["pytest>=7.4"]

# 真语义向量：本地模型服务（Ollama / llama.cpp / LM Studio / vLLM）与云端
# （硅基流动 BAAI/bge-m3）都是同一个 OpenAI 兼容接口 POST /v1/embeddings，
# 由标准库 urllib 实现，因此 **无需额外第三方依赖**，改 api_base 即可切换。

[project.urls]
Homepage = "https://github.com/handar-code/Cortex"
Repository = "https://github.com/handar-code/Cortex"
Issues = "https://github.com/handar-code/Cortex/issues"
Changelog = "https://github.com/handar-code/Cortex/releases"

# 独立命令行入口：pip install 后可直接用 `cortex <子命令>`，无需再记 python -m。
# 保留 `doc-system` 作为兼容别名，两者指向同一 main()。
[project.scripts]
cortex = "doc_system.cli:main"
doc-system = "doc_system.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的用例：fixtures/sample_project 里的 .py 是「被抽取的样本项目」，
# 不是测试，禁止被 pytest 误当成 test_* 收集执行。
testpaths = ["tests"]
python_files = ["test_*.py"]
