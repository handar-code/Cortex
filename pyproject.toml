[project]
name = "doc-system"
version = "0.1.0"
description = "通用、从零构建的项目知识库文档系统（不耦合任何具体项目）"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
ann = ["hnswlib>=0.8.0", "numpy"]
remote = ["requests"]

# 独立命令行入口：pip install 后可直接用 `cortex <子命令>`，无需再记 python -m。
# 保留 `doc-system` 作为兼容别名，两者指向同一 main()。
[project.scripts]
cortex = "doc_system.cli:main"
doc-system = "doc_system.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的用例：fixtures/sample_project 里的 .py 是「被抽取的样本项目」，
# 不是测试，禁止被 pytest 误当成 test_* 收集执行。
testpaths = ["tests"]
python_files = ["test_*.py"]

