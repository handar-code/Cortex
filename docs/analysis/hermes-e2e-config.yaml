# 真实项目端到端测试配置 · 目标项目 = hermes-agent
# 本文件是「目标项目专属配置」，doc-system 系统代码不含任何项目硬编码。
# roots 用绝对路径指向 hermes-agent 的根级核心代码 + 一组代表性模块；
# 仍排除 114M 的 context_system/ 与数千 ts（未声明语言），靠 files_only / 黑名单 / languages 三层裁剪。
# 所有产物一律落在 <e2e-artifacts>/artifacts/，绝不写入 hermes-agent，也不写入 doc-system 源码仓。

project:
  name: "hermes-agent"

roots:
  # 根级核心代码：cli.py(852K) / hermes_state.py(456K) / run_agent.py(408K) 等 19 个 .py
  # + AGENTS.md / README.md。files_only:true = 只吃该层文件，不递归进巨型子目录。
  - path: "<target-project>"
    files_only: true
  - path: "<target-project>/agent"
  - path: "<target-project>/gateway"
  - path: "<target-project>/context_management"
  - path: "<target-project>/hermes_db"
  - path: "<target-project>/hermes_delegation"
  - path: "<target-project>/acp_adapter"
  - path: "<target-project>/cron"
  - path: "<target-project>/legacy"
  - path: "<target-project>/docs/design"

blacklist:
  - "**/__pycache__/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/*.egg-info/**"
  - "**/*.generated.*"
  - "**/*.gen.*"

languages:
  - name: python
    extensions: [".py"]
    extractor: python_ast
  - name: plaintext
    extensions: [".md", ".txt"]
    extractor: plaintext

triage:
  test_patterns:
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/*.spec.*"
    - "**/__tests__/**"
  generated_patterns:
    - "**/*.generated.*"
    - "**/*.gen.*"

# 向量通道（三件套之一 · 设计稿 §13.4）
# 默认走硅基流动 BAAI/bge-m3（免费、不限次、不限速）：corpus 全量真语义索引。
# 本机零负担（算力在云端），且 bge-m3 免费后无成本顾虑。
# 断网 / 零配置 / 无 key 环境：把 provider 改回 offline 即可（纯本地哈希，零依赖兜底）。
embedding:
  provider: siliconflow
  model: "BAAI/bge-m3"
  api_base: "https://api.siliconflow.cn/v1/embeddings"
  api_key_env: "SILICONFLOW_API_KEY"
  batch_size: 32

# §12 归因双轨：真实项目无 @domain 时，domain 由目录树 scope + 向量隐式轨自动填充。
# 隐式轨向量也切 bge-m3：软归因吃到真语义（而非只看 docstring 截断的哈希），§12.3 域质心更准。
attribution:
  enabled: true
  provider: siliconflow       # 隐式轨向量：siliconflow 真语义（断网兜底改回 offline）
  scope_depth: 1             # 域骨架层级（scope→module 目录树，§13.4 Q5）
  domain_from: structural    # 无显式键时归属键：structural(目录树,可复现) / vector(语义)
  text_channel: true         # §13.4 注释文本(docstring)独立检索通道

# 近万符号时 O(n²) 精确近邻不可行 → 启用候选池采样近似（O(n·pool)）
index:
  neighbor_pool: 512

# 检索增强（选项 C · 查询时重排）：corpus 已是 bge-m3 真语义索引时，
# 查询时 query 也用 bge-m3 嵌入直接比对，排序即真语义 → rerank 冗余，置 null 关闭。
# 仅当 corpus 退回 offline 哈希时，才需要 rerank=siliconflow 补语义。
retrieval:
  rerank: null
  rerank_candidates: 20

optional:
  typedoc_site: false
  pagefind: false
  demo: false
  mkdocs: false              # 测试环境不依赖 mkdocs 二进制
